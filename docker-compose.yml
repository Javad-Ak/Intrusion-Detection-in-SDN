version: '3.8'

services:
  edge-controller-sim:
    build: .
    volumes:
      - ./artifacts:/app/artifacts
      - ./edge_benchmark.py:/app/edge_benchmark.py
    deploy:
      resources:
        limits:
          cpus: '1.0'      # Hard-capped to exactly 1 CPU core
          memory: 512M     # Hard-capped to 512 Megabytes of RAM